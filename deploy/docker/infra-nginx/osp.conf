# Запись портала ОСП в общем nginx сервера (контейнер infra-nginx, каталог conf.d). Один файл: остальные
# сайты сервера он не затрагивает. Ставится один раз, выкладки портала его не меняют.
# Проверяется в tests/deploy/docker.test.mjs.
#
# Перед установкой заменить (deploy/docker/README.md):
#   __NAMES__  — имена сайта через пробел: osp.root.sx и, на время проверки, запасное имя сервера;
#   __CERT__ / __KEY__ — сертификат и ключ этих имён в контейнере infra-nginx.
#
# Здесь только приём HTTPS и пересылка в контейнер сайта (osp-web:8080 во внешней сети проекта).
# Правила самого сайта и /api — в контейнере (deploy/docker/web/site.conf).
#
# Имя osp-web ищется при каждом запросе, а не при запуске nginx: если контейнеры ОСП остановлены, общий
# nginx запускается и перечитывает настройки как обычно, а 502 получает только сайт ОСП. Со статическим
# адресом остановленный портал не дал бы запуститься общему nginx — и вместе с ним всем сайтам сервера.

# В журнал — без строки параметров: ключ выдачи расценок может прийти как ?key=.
log_format osp_noargs '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                      '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    listen 80;
    server_name __NAMES__;
    access_log /var/log/nginx/access.log osp_noargs;

    # /api — только по HTTPS. Без перенаправления: Location вернул бы ?key= обратно, и клиент продолжил
    # бы слать ключ открытым текстом.
    location ~ ^/api(/|$) {
        return 403;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name __NAMES__;

    ssl_certificate __CERT__;
    ssl_certificate_key __KEY__;

    access_log /var/log/nginx/access.log osp_noargs;
    # Ошибки соединения пишут строку запроса целиком (с ?key=): только критические.
    error_log /var/log/nginx/error.log crit;

    # Самое большое тело — массовые загрузки через шлюз данных; точные пределы по адресам — в контейнере.
    client_max_body_size 50m;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $osp_web http://osp-web:8080;

    location / {
        proxy_pass $osp_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Чуть дольше, чем ждёт контейнер сайта (180 с — ответ ИИ, 130 с — шлюз данных).
        proxy_read_timeout 185s;
        proxy_send_timeout 135s;
        # Загрузка тела целиком до пересылки не нужна: контейнер сайта принимает его сам.
        proxy_request_buffering off;
    }
}
