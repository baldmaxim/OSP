# Сайт портала и /api/ внутри контейнера (deploy/docker/web.Dockerfile). Правила — те же, что в
# deploy/nginx/osp.root.sx.conf прежнего сервера; отличия: HTTPS принимает общий nginx сервера
# (deploy/docker/infra-nginx/osp.conf), сюда приходит HTTP по внутренней сети; журналы — в stdout.
# Проверяется в tests/deploy/docker.test.mjs.

# В журнал — без строки параметров (в /api/ ключ rates-api может прийти как ?key=) и без Referer (в нём мог
# бы оказаться адрес страницы с параметрами). Адрес — клиента ($osp_client_ip, nginx.conf).
log_format osp_api_noargs '$osp_client_ip - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                          '$status $body_bytes_sent "$http_user_agent"';
# Грубая защита /api/ от потока запросов с одного адреса; справедливые лимиты по пользователю — в osp-api.
limit_req_zone $osp_client_ip zone=osp_api:10m rate=20r/s;

server {
    listen 8080;
    server_name _;

    root /var/www/osp/current;
    index index.html;
    access_log /dev/stdout osp_api_noargs;

    # Имя контейнера API ищется при каждом запросе (встроенный DNS Docker): после перезапуска API у
    # него другой адрес, и запомненный при старте nginx перестал бы работать. Имя — своё, osp-api:
    # контейнер сайта подключён и к общей сети сервера, где «api» может быть именем соседнего проекта.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $osp_api http://osp-api:8787;

    # Хэш-файлы недавних сборок — общий каталог. ^~ важнее регулярного выражения ниже.
    location ^~ /assets/ {
        root /var/www/osp;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    # Свой API. ^~ — чтобы регулярные выражения не перехватывали /api/.
    location ^~ /api/ {
        # /api/ — только по HTTPS; перенаправления нет: Location вернул бы ?key= обратно.
        if ($http_x_forwarded_proto = "http") {
            return 403;
        }
        # Ошибки соединения пишут строку запроса целиком (с ?key=): только критические.
        error_log /dev/stderr crit;
        limit_req zone=osp_api burst=40 nodelay;
        limit_req_status 429;
        client_max_body_size 2m;
        proxy_pass $osp_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Адрес клиента — одним значением (перезапись, не дописывание): osp-api доверяет X-Forwarded-For только
        # от этого контейнера (OSP_TRUST_PROXY=peer). Жетон общего nginx дальше не передаётся.
        proxy_set_header X-Real-IP $osp_client_ip;
        proxy_set_header X-Forwarded-For $osp_client_ip;
        proxy_set_header X-OSP-Edge "";
        proxy_set_header X-OSP-Client-IP "";
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # Ответ ИИ идёт дольше 60 с; osp-api ждёт не больше 170 с.
        proxy_read_timeout 180s;
        proxy_send_timeout 60s;
        # Подписанные ссылки и данные реестра не кешируются: ровно один заголовок.
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
    }
    # Шлюз данных (osp-api /api/db → PostgREST → база). Сюда идёт каждый запрос страниц портала:
    # без лимита по адресу (весь офис выходит с одного), большие тела для массовых загрузок, сжатие.
    location ^~ /api/db/ {
        if ($http_x_forwarded_proto = "http") {
            return 403;
        }
        error_log /dev/stderr crit;
        client_max_body_size 50m;
        proxy_pass $osp_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Адрес клиента — одним значением (перезапись, не дописывание): osp-api доверяет X-Forwarded-For только
        # от этого контейнера (OSP_TRUST_PROXY=peer). Жетон общего nginx дальше не передаётся.
        proxy_set_header X-Real-IP $osp_client_ip;
        proxy_set_header X-Forwarded-For $osp_client_ip;
        proxy_set_header X-OSP-Edge "";
        proxy_set_header X-OSP-Client-IP "";
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # osp-api ждёт PostgREST не больше 125 с.
        proxy_read_timeout 130s;
        proxy_send_timeout 130s;
        gzip on;
        gzip_types application/json application/vnd.pgrst.object+json;
        gzip_min_length 1024;
        gzip_proxied any;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
    }
    # /api без косой черты — не API, но в опечатке всё равно может быть ?key=.
    location = /api {
        return 404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /version.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }
    # Runtime-конфиг: файл на сервере (каталог shared). Нет файла — 404, а не index.html.
    location = /config.json {
        root /etc/osp/shared;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
    location ~* \.(?:js|css|woff2?|ttf|png|jpg|jpeg|svg|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
