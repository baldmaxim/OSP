# Заголовки защиты браузера — на каждый ответ сайта и /api/. Подключается в каждом location, где есть свой add_header:
# такой location заголовки блока server не наследует. Проверяется в tests/deploy/docker.test.mjs.
# HSTS — только на это имя, без includeSubDomains: на su10.ru живут соседние порталы.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), payment=(), usb=()" always;
