# nginx контейнера сайта (deploy/docker/web.Dockerfile). Работает не от root и при файловой системе
# только на чтение: служебные файлы — в /tmp (tmpfs), журналы — в stdout/stderr контейнера.
# Один процесс: у контейнера четверть ядра (compose.yml), второй лишь занимал бы память.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    # Вид ответа зависит от Accept-Encoding: кэш по дороге не должен отдать сжатое тому, кто его не просил.
    # Сжатие на лету здесь не включается: у статики — готовые копии (site.conf, gzip_static), у /api/db — своё правило.
    gzip_vary on;
    gzip_proxied any;

    # Адрес клиента ($osp_client_ip) — только от нашей записи в общем nginx сервера: она ставит
    # X-OSP-Client-IP и жетон X-OSP-Edge (infra-nginx/site.conf.template). Жетон знают только эта запись и
    # этот контейнер (OSP_EDGE_TOKEN), поэтому соседний контейнер в общей сети адрес клиента не подделает.
    # Нет жетона или он чужой — адрес соединения. Файл собирает entrypoint.sh при запуске.
    # Жетон — до 128 знаков; со значением по умолчанию (64) такой ключ map не помещается и nginx не стартует.
    map_hash_bucket_size 256;
    include /tmp/osp-edge.conf;

    include /etc/nginx/conf.d/*.conf;
}
