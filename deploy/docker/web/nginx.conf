# nginx контейнера сайта (deploy/docker/web.Dockerfile). Работает не от root и при файловой системе
# только на чтение: служебные файлы — в /tmp (tmpfs), журналы — в stdout/stderr контейнера.
worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    # Перед контейнером стоит общий nginx сервера: он принимает HTTPS и передаёт адрес клиента в
    # X-Forwarded-For. Доверяем этому заголовку только от адресов внутренних сетей Docker — тогда
    # ограничение частоты /api/ считается по клиенту, а не по одному адресу общего nginx.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    include /etc/nginx/conf.d/*.conf;
}
