# Политика содержимого — на страницу портала (index.html). Проверяется в tests/deploy/docker.test.mjs и на настоящей
# карте и окне просмотра — tests/release/csp.test.mjs.
#
# Главное здесь — script-src: только свои файлы и API Яндекс.Карт («Объекты», ему нужен unsafe-eval); встроенные
# скрипты и адреса javascript: не выполняются. Источники данных широкие намеренно: файлы приходят по подписанным
# ссылкам хранилища, «Скачать ДП» читает документ из Google — узкий список ломал бы их при смене адреса.
# frame-ancestors — вместе с X-Frame-Options: портал нельзя встроить в чужую страницу.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' https://api-maps.yandex.ru https://*.maps.yandex.net https://yastatic.net https://suggest-maps.yandex.ru https://yandex.ru; style-src 'self' 'unsafe-inline' blob: https://fonts.googleapis.com; font-src 'self' data: blob: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' blob: data: https:; frame-src 'self' blob: https:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
