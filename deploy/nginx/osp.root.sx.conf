# osp.root.sx - this file is kept in git: deploy/nginx/osp.root.sx.conf (docs/DEPLOYMENT.md, osp-api).
# Installed as /etc/nginx/sites-available/osp.root.sx; checked by tests/deploy/nginx.test.mjs.

# /api/ is logged without the query string: the rates-api key may come as ?key=.
log_format osp_api_noargs '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                          '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
# Coarse flood guard for /api/ per client IP; fair per-user limits live inside osp-api.
# Revisit before /api/rest (data proxy): a whole office may share one IP.
limit_req_zone $binary_remote_addr zone=osp_api:10m rate=20r/s;

server {
    server_name osp.root.sx;

    root /var/www/osp/current;
    index index.html;

    # Hashed files of recent builds: shared folder. ^~ wins over the regex location below.
    location ^~ /assets/ {
        root /var/www/osp;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    # Own API (osp-api, server/osp-api): only 127.0.0.1:8787. ^~ so regex locations never catch /api/.
    location ^~ /api/ {
        access_log /var/log/nginx/osp-access.log osp_api_noargs;
        # Upstream errors log the full request line (with ?key=): only critical ones here.
        error_log  /var/log/nginx/osp-error.log crit;
        limit_req zone=osp_api burst=40 nodelay;
        limit_req_status 429;
        client_max_body_size 2m;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI answers take longer than the default 60 s; osp-api waits at most 170 s.
        proxy_read_timeout 180s;
        proxy_send_timeout 60s;
        # Signed URLs and registry data: never cached, exactly one header.
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
    }
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /version.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }
    # Runtime config: no file gives 404 (not index.html), the app uses build values.
    location = /config.json {
        root /var/www/osp/shared;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
    location ~* \.(?:js|css|woff2?|ttf|png|jpg|jpeg|svg|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    access_log /var/log/nginx/osp-access.log;
    error_log  /var/log/nginx/osp-error.log;

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/osp.root.sx/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/osp.root.sx/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = osp.root.sx) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name osp.root.sx;
    return 404; # managed by Certbot


}
